  <style>
    :root {
      --bg: #18191e;
      --deck-bg: #131418;
      --steel: #f4f4f5;
      --steel-dim: #9ca3af;
      --steel-border: #2a2c35;
      --accent-glow: rgba(244, 244, 245, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--bg) !important;
      color: var(--steel);
      font-family: 'Syne', 'Noto Sans TC', sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      background: var(--bg) !important;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      cursor: pointer;
    }

    .admin-dot-btn {
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      gap: 4px;
      padding: 8px;
    }
    .admin-dot-btn span {
      width: 4px;
      height: 4px;
      background: #6b7280;
      border-radius: 50%;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--bg) !important;
    }

    #threejs-box {
      width: 100%;
      height: 52%;
      position: relative;
      touch-action: none;
      cursor: grab;
      background: transparent !important;
    }
    #threejs-box:active {
      cursor: grabbing;
    }

    .info-lyrics-container {
      height: 48%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding: 0 16px;
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .track-meta {
      text-align: center;
      margin-bottom: 2px;
      z-index: 10;
    }
    .track-meta h1 {
      font-family: 'Orbitron', 'Syne', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 1px;
      color: #ffffff;
    }
    .track-meta p {
      font-size: 0.75rem;
      color: var(--steel-dim);
      margin-top: 2px;
    }

    .lyrics-view {
      width: 100%;
      max-width: 580px;
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 24px 16px 80px;
      scrollbar-width: none;
    }
    .lyrics-view::-webkit-scrollbar {
      display: none;
    }

    .lyric-row {
      text-align: center;
      font-size: 0.82rem;
      color: #6b7280;
      line-height: 1.5;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .lyric-row.active {
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      transform: scale(1.02);
    }

    /* 操作框：保有完整邊框設計，並將顏色延伸填滿螢幕最底部的安全區域 */
    footer.retro-deck {
      background: var(--deck-bg) !important;
      border-top: 1px solid var(--steel-border);
      box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
      padding: 10px 14px calc(24px + env(safe-area-inset-bottom, 20px));
      z-index: 25;
      width: 100%;
      flex-shrink: 0;
    }

    .timeline-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto 10px;
      padding: 0 4px;
    }
    .retro-time {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--steel-dim);
      min-width: 36px;
    }

    .seek-groove {
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
      touch-action: none;
    }
    .seek-track {
      width: 100%;
      height: 4px;
      background: #23252d;
      border-radius: 2px;
      position: relative;
    }
    .seek-bar {
      height: 100%;
      background: linear-gradient(90deg, #6b7280, #e4e4e7);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
      position: relative;
    }
    .seek-thumb {
      position: absolute;
      right: -5px;
      top: -4px;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
      pointer-events: none;
    }

    .deck-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 480px;
      margin: 0 auto;
      gap: 6px;
      padding: 0 2px;
    }

    .steel-select-group {
      display: flex;
      gap: 5px;
      flex-shrink: 1;
      min-width: 0;
    }
    .steel-select {
      background: #1c1d24;
      border: 1px solid #333642;
      color: #e4e4e7;
      font-size: 0.7rem;
      padding: 5px 6px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      width: 82px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .buttons-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .steel-knob-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2a2c36 0%, #171820 100%);
      border: 1px solid #3e414f;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .steel-knob-btn:active {
      transform: scale(0.92);
    }
    .steel-knob-btn svg {
      width: 14px;
      height: 14px;
      fill: #d1d5db;
    }

    .play-master-btn {
      width: 46px;
      height: 46px;
      background: radial-gradient(circle at 35% 35%, #4b4e5d 0%, #20222a 100%);
      border: 1.5px solid #8b90a0;
      box-shadow: 0 0 12px var(--accent-glow), inset 0 1px 2px rgba(255,255,255,0.25);
    }
    .play-master-btn svg {
      width: 17px;
      height: 17px;
      fill: #ffffff;
    }

    .modal-veil {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-inner {
      background: #181920;
      border: 1px solid #333642;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .modal-inner h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      color: #f4f4f5;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .field-row {
      margin-bottom: 12px;
    }
    .field-row label {
      display: block;
      font-size: 0.78rem;
      color: var(--steel-dim);
      margin-bottom: 4px;
    }
    .field-row input, .field-row textarea, .field-row select {
      width: 100%;
      background: #111216;
      border: 1px solid #2d303a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 10px;
      outline: none;
    }
    .field-row textarea {
      font-family: monospace;
      font-size: 0.78rem;
      resize: vertical;
    }
    .btn-steel {
      background: #2b2e3a;
      border: 1px solid #454959;
      color: #fafafa;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid #333642;
      color: #9ca3af;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .song-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #111216;
      border: 1px solid #242630;
      margin-bottom: 4px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .song-actions {
      display: flex;
      gap: 6px;
    }
    .btn-act {
      border: none;
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-edit { background: #3b82f6; color: #fff; }
    .btn-del { background: #ef4444; color: #fff; }

    // 支援 [00:12.21] 毫秒與 [00:12] 秒格式的雙向解析器
    function parseLrc(txt) {
      if (!txt) return [];
      return txt.split('\n').map(l => {
        const m = l.match(/\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)/);
        if (m) {
          const t = parseInt(m[1]) * 60 + parseFloat(m[2]);
          return { time: t, text: m[3] || '' };
        }
        return null;
      }).filter(Boolean).sort((a,b) => a.time - b.time);
    }

    // 格式化輸出為 [00:12.21] 形式
    function formatLrcTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(2);
      return `[${String(m).padStart(2,'0')}:${String(s).padStart(5,'0')}]`;
    }

      if (!url) return '';

                         url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch) return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
      if (url.includes('dropbox.com')) return url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
      if (url.includes('imgur.com') && !url.includes('i.imgur.com')) {
        const id = url.split('/').pop().split('.')[0];
        return `https://i.imgur.com/${id}.jpg`;
      }
      if (url.includes('github.com') && url.includes('/blob/')) {
        return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
      }
      return url;
    }

      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#0f1014';
      ctx.fillRect(0, 0, 1024, 1024);

      const grad = ctx.createConicGradient(0, 512, 512);
      grad.addColorStop(0.00, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(0.12, 'rgba(65, 68, 80, 0.65)');
      grad.addColorStop(0.25, 'rgba(15, 16, 20, 1)');

      grad.addColorStop(0.75, 'rgba(15, 16, 20, 1)');
      grad.addColorStop(1.00, 'rgba(15, 16, 20, 1)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(512, 512, 500, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.lineWidth = 2.5;

      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const deltaX = clientX - prevPointerX;
      const deltaY = clientY - prevPointerY;

      targetRotX += deltaY * 0.006;

          nativeAudio.load();
        }

        if (currentSec > 0 && Math.abs(nativeAudio.currentTime - currentSec) > 1) {
          nativeAudio.currentTime = currentSec;
        }

        const p = nativeAudio.play();
        if (p !== undefined) {
          p.then(() => setPlayState(true)).catch(err => {
            console.log("等待點擊播放:", err);
            setPlayState(false);
          });
        }
      }
    }

    function pauseActiveSong() {
      setPlayState(false);
      if (playMode === 'file') {
        currentSec = nativeAudio.currentTime;
        nativeAudio.pause();
      } else {
        clearInterval(ytTimer);
        ytIframe.src = '';
      }
    }

    /* -------------------------------------------------------------
     * 5. 進度條拖曳控制
     * ------------------------------------------------------------*/
    const seekContainer = document.getElementById('seek-container');
    const seekProgress = document.getElementById('seek-progress');

    function getSeekFraction(e) {
      const rect = seekContainer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pos = clientX - rect.left;
      return Math.min(1, Math.max(0, pos / rect.width));
    }

    function handleSeekMove(e) {
      if (!isDraggingSeek) return;
      const frac = getSeekFraction(e);
      seekProgress.style.width = `${frac * 100}%`;
      const cur = frac * totalDuration;
      const m = Math.floor(cur / 60);
      const s = Math.floor(cur % 60);
      document.getElementById('lbl-curr').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function handleSeekEnd(e) {
      if (!isDraggingSeek) return;
      isDraggingSeek = false;
      const frac = getSeekFraction(e.changedTouches ? e.changedTouches[0] : e);
      currentSec = frac * totalDuration;

      if (playMode === 'file') {
        nativeAudio.currentTime = currentSec;
      } else {
        if (isPlaying) playActiveSong();
      }
      updateProgressUI(currentSec, totalDuration);
    }

    seekContainer.addEventListener('mousedown', (e) => { isDraggingSeek = true; handleSeekMove(e); });
    window.addEventListener('mousemove', handleSeekMove);
    window.addEventListener('mouseup', handleSeekEnd);

    seekContainer.addEventListener('touchstart', (e) => { isDraggingSeek = true; handleSeekMove(e); }, { passive: false });
    window.addEventListener('touchmove', handleSeekMove, { passive: false });
    window.addEventListener('touchend', handleSeekEnd);

    /* -------------------------------------------------------------
     * 6. 歌詞與切換渲染 (毫秒精度同步)
     * ------------------------------------------------------------*/
    function syncLyrics(sec) {
      const song = store[plIdx]?.songs[trackIdx];
      if (!song || !song.lyrics) return;

      let idx = -1;
      for (let i = 0; i < song.lyrics.length; i++) {
        if (sec >= song.lyrics[i].time) idx = i;
        else break;
      }

      const rows = document.querySelectorAll('.lyric-row');
      rows.forEach((r, i) => {
        if (i === idx) {
          if (!r.classList.contains('active')) {
            r.classList.add('active');
            const scroller = document.getElementById('lyrics-scroller');
            scroller.scrollTo({ top: r.offsetTop - (scroller.clientHeight / 2) + 8, behavior: 'smooth' });
          }
        } else {
          r.classList.remove('active');
        }
      });
    }

    function renderLyricsList() {
      const scroller = document.getElementById('lyrics-scroller');
      scroller.innerHTML = '';
      const song = store[plIdx]?.songs[trackIdx];

      if (!song || !song.lyrics || song.lyrics.length === 0) {
        scroller.innerHTML = '<div class="lyric-row">純音樂 / Instrumental</div>';
        return;
      }

      song.lyrics.forEach(l => {
        const div = document.createElement('div');
        div.className = 'lyric-row';
        div.textContent = l.text;
        div.onclick = () => {
          currentSec = l.time;
          if (playMode === 'file') nativeAudio.currentTime = currentSec;
          else playActiveSong();
        };
        scroller.appendChild(div);
      });
    }

    function renderUI() {
      const curPl = store[plIdx];
      const song = curPl?.songs[trackIdx];
      if (!song) return;

      document.getElementById('disp-title').textContent = song.title;
      document.getElementById('disp-artist').textContent = song.artist;

      applyCoverTo3D(song.cover || curPl.cover, song.backCover);
      renderLyricsList();
      populateDropdowns();
    }

    function playNext() {
      const pl = store[plIdx];
      if (!pl || pl.songs.length === 0) return;
      trackIdx = (trackIdx + 1) % pl.songs.length;
      currentSec = 0;
      playActiveSong();
    }

    function playPrev() {
      const pl = store[plIdx];
      if (!pl || pl.songs.length === 0) return;
      trackIdx = (trackIdx - 1 + pl.songs.length) % pl.songs.length;
      currentSec = 0;
      playActiveSong();
    }

    document.getElementById('btn-play').onclick = () => {
      if (isPlaying) pauseActiveSong();
      else playActiveSong();
    };
    document.getElementById('btn-next').onclick = playNext;
    document.getElementById('btn-prev').onclick = playPrev;

    function populateDropdowns() {
      const pSel = document.getElementById('sel-playlist');
      pSel.innerHTML = '';
      store.forEach((p, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = p.name;
        if (i === plIdx) opt.selected = true;
        pSel.appendChild(opt);
      });

      const sSel = document.getElementById('sel-song');
      sSel.innerHTML = '';
      const songs = store[plIdx]?.songs || [];
      songs.forEach((s, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = s.title;
        if (i === trackIdx) opt.selected = true;
        sSel.appendChild(opt);
      });
    }

    document.getElementById('sel-playlist').onchange = (e) => {
      plIdx = parseInt(e.target.value);
      trackIdx = 0;
      currentSec = 0;
      playActiveSong();
    };
    document.getElementById('sel-song').onchange = (e) => {
      trackIdx = parseInt(e.target.value);
      currentSec = 0;
      playActiveSong();
    };

    /* -------------------------------------------------------------
     * 7. 管理者模式
     * ------------------------------------------------------------*/
    const mountPoint = document.getElementById('admin-mount-point');

    function openAuthModal() {
      mountPoint.innerHTML = document.getElementById('auth-tpl').innerHTML;
      const authInput = document.getElementById('auth-input');
      authInput.focus();

      document.getElementById('btn-auth-close').onclick = () => { mountPoint.innerHTML = ''; };
      document.getElementById('btn-auth-submit').onclick = () => {
        if (authInput.value === '0401') {
          openAdminDashboard();
        } else {
          alert('驗證失敗！');
        }
      };
    }

    document.getElementById('btn-open-auth').onclick = openAuthModal;
    document.getElementById('logo-trigger').onclick = openAuthModal;

    function openAdminDashboard() {
      mountPoint.innerHTML = document.getElementById('admin-tpl').innerHTML;

      const scaleSlider = document.getElementById('scale-slider');
      scaleSlider.value = modelScale;
      document.getElementById('scale-val-lbl').textContent = `${modelScale}x`;
      scaleSlider.oninput = (e) => {
        modelScale = parseFloat(e.target.value);
        document.getElementById('scale-val-lbl').textContent = `${modelScale}x`;
        turntableGroup.scale.set(modelScale, modelScale, modelScale);
      };

      document.getElementById('btn-pick-img').onclick = () => document.getElementById('local-img-picker').click();
      document.getElementById('local-img-picker').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('form-song-cover').value = event.target.result;
          document.getElementById('img-picker-status').textContent = `已載入: ${file.name}`;
        };
        reader.readAsDataURL(file);
      };

      document.getElementById('btn-pick-back-img').onclick = () => document.getElementById('local-back-img-picker').click();
      document.getElementById('local-back-img-picker').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('form-song-back-cover').value = event.target.result;
          document.getElementById('back-img-picker-status').textContent = `已載入: ${file.name}`;
        };
        reader.readAsDataURL(file);
      };

      document.getElementById('btn-close-admin').onclick = () => {
        mountPoint.innerHTML = '';
        persistData();
        renderUI();
      };

      document.getElementById('btn-save-song').onclick = saveSongHandler;
      document.getElementById('btn-cancel-edit').onclick = resetSongForm;
      document.getElementById('btn-add-pl').onclick = addPlaylistHandler;

      document.getElementById('btn-copy-code').onclick = () => {
        navigator.clipboard.writeText(document.documentElement.outerHTML).then(() => {
          alert('已將當前完整 HTML 程式碼複製到剪貼簿！');
        });
      };

      document.getElementById('btn-dl-html').onclick = () => {
        const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
      };

      renderAdminTree();
    }

    function renderAdminTree() {
      const targetPlSel = document.getElementById('form-pl-target');
      if (!targetPlSel) return;
      targetPlSel.innerHTML = '';
      store.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = p.name;
        targetPlSel.appendChild(opt);
      });

      const tree = document.getElementById('admin-tree-view');
      tree.innerHTML = '';
      store.forEach((p, pI) => {
        const pBox = document.createElement('div');
        pBox.style.cssText = "margin-bottom:10px; background:#111216; padding:8px; border-radius:6px; border:1px solid #282a35;";
        pBox.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="color:#e4e4e7; font-size:0.82rem;">📁 ${p.name} (${p.songs.length})</strong>
            <button class="btn-act btn-del" onclick="window.delPl(${pI})">刪除歌單</button>
          </div>
        `;

        p.songs.forEach((s, sI) => {
          const sRow = document.createElement('div');
          sRow.className = 'song-item-row';
          sRow.innerHTML = `
            <span>🎵 ${s.title}</span>
            <div class="song-actions">
              <button class="btn-act btn-edit" onclick="window.editS(${pI}, ${sI})">編輯 ✎</button>
              <button class="btn-act btn-del" onclick="window.delS(${pI}, ${sI})">刪除</button>
            </div>
          `;
          pBox.appendChild(sRow);
        });
        tree.appendChild(pBox);
      });
    }

    window.delPl = (pI) => {
      if (store.length <= 1) return alert('請至少保留一個歌單！');
      if (confirm(`確定刪除歌單《${store[pI].name}》？`)) {
        store.splice(pI, 1);
        if (plIdx >= store.length) plIdx = 0;
        persistData();
        renderAdminTree();
        renderUI();
      }
    };

    window.delS = (pI, sI) => {
      store[pI].songs.splice(sI, 1);
      persistData();
      renderAdminTree();
      renderUI();
    };

    window.editS = (pI, sI) => {
      const s = store[pI].songs[sI];
      document.getElementById('form-mode-title').textContent = `✦ 編輯歌曲: ${s.title}`;
      document.getElementById('edit-song-id').value = `${pI}_${sI}`;
      document.getElementById('form-pl-target').value = pI;
      document.getElementById('form-song-title').value = s.title;
      document.getElementById('form-song-artist').value = s.artist;
      document.getElementById('form-song-source').value = s.source;
      document.getElementById('form-song-cover').value = s.cover || '';
      document.getElementById('form-song-back-cover').value = s.backCover || '';

      const lyricsStr = (s.lyrics || []).map(l => `${formatLrcTime(l.time)} ${l.text}`).join('\n');
      document.getElementById('form-song-lyrics').value = lyricsStr;

      document.getElementById('btn-cancel-edit').style.display = 'inline-block';
      document.getElementById('admin-modal').scrollTo({ top: 0, behavior: 'smooth' });
    };

    function resetSongForm() {
      document.getElementById('form-mode-title').textContent = '✦ 新增歌曲';
      document.getElementById('edit-song-id').value = '';
      document.getElementById('form-song-title').value = '';
      document.getElementById('form-song-artist').value = '';
      document.getElementById('form-song-source').value = '';
      document.getElementById('form-song-cover').value = '';
      document.getElementById('form-song-back-cover').value = '';
      document.getElementById('form-song-lyrics').value = '';
      document.getElementById('img-picker-status').textContent = '';
      document.getElementById('back-img-picker-status').textContent = '';
      document.getElementById('btn-cancel-edit').style.display = 'none';
    }

    function saveSongHandler() {
      const editKey = document.getElementById('edit-song-id').value;
      const targetPl = parseInt(document.getElementById('form-pl-target').value);
      const title = document.getElementById('form-song-title').value.trim();
      const artist = document.getElementById('form-song-artist').value.trim() || 'Winter';
      const source = document.getElementById('form-song-source').value.trim();
      const rawCover = document.getElementById('form-song-cover').value.trim();
      const rawBackCover = document.getElementById('form-song-back-cover').value.trim();
      const cover = normalizeImageUrl(rawCover) || store[targetPl]?.cover || 'https://lh3.googleusercontent.com/d/1uaaVb_4JOQ9dF7wSlNxtIVHKMViueEa6';
      const backCover = normalizeImageUrl(rawBackCover) || '';
      const lyricsRaw = document.getElementById('form-song-lyrics').value;

      if (!title || !source) return alert('請填寫完整歌名與音訊來源！');

      const songObj = {
        title,
        artist,
        source,
        cover,
        backCover,
        duration: 230,
        lyrics: parseLrc(lyricsRaw)
      };

      if (editKey) {
        const [oldPI, oldSI] = editKey.split('_').map(Number);
        if (oldPI === targetPl) {
          store[oldPI].songs[oldSI] = songObj;
        } else {
          store[oldPI].songs.splice(oldSI, 1);
          store[targetPl].songs.push(songObj);
        }
      } else {
        store[targetPl].songs.push(songObj);
      }

      persistData();
      renderAdminTree();
      renderUI();
      resetSongForm();
      alert(`歌曲《${title}》已成功儲存！`);
    }

    function addPlaylistHandler() {
      const name = document.getElementById('admin-new-pl-name').value.trim();
      if (!name) return alert('請輸入歌單名稱！');
      store.push({ id: 'pl_' + Date.now(), name, songs: [] });
      document.getElementById('admin-new-pl-name').value = '';
      persistData();
      renderAdminTree();
      renderUI();
    }

    renderUI();
  </script>
</body>
