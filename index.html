<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zy playlist</title>
  
  <!-- 引入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0c10;
      --panel-bg: #14161d;
      --card-bg: rgba(26, 29, 39, 0.85);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --lcd-green: #38bdf8;
      --border-color: #272a37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #171923 0%, var(--bg-color) 100%);
      color: var(--text-main);
      font-family: 'Noto Sans TC', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 頂部導覽列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(15, 17, 24, 0.7);
      backdrop-filter: blur(12px);
      z-index: 20;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .secret-admin-trigger {
      background: transparent;
      border: 1px solid transparent;
      color: #374151;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .secret-admin-trigger:hover {
      color: var(--text-sub);
      border-color: var(--border-color);
    }

    /* 主畫面佈局 (左右分割) */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 20px 40px;
      height: calc(100vh - 230px);
      min-height: 380px;
    }

    /* 左側：Three.js 3D 黑膠展示區 */
    .vinyl-stage-container {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #threejs-canvas-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
    }
    #threejs-canvas-wrapper:active {
      cursor: grabbing;
    }

    .stage-hint {
      position: absolute;
      bottom: 16px;
      left: 20px;
      font-size: 0.75rem;
      color: var(--text-sub);
      pointer-events: none;
    }

    /* 右側：動態歌詞區 */
    .lyrics-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .lyrics-header {
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 12px;
    }
    .lyrics-header h2 {
      font-size: 1.25rem;
      color: #fff;
    }
    .lyrics-header p {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .lyrics-scroller {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 40px 10px;
    }
    .lyrics-scroller::-webkit-scrollbar {
      width: 4px;
    }
    .lyrics-scroller::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .lyric-line {
      font-size: 1.05rem;
      color: #4b5563;
      text-align: center;
      transition: all 0.3s ease;
      line-height: 1.6;
      cursor: pointer;
    }
    .lyric-line:hover {
      color: #9ca3af;
    }
    .lyric-line.active {
      color: var(--lcd-green);
      font-size: 1.35rem;
      font-weight: 700;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      transform: scale(1.04);
    }

    /* 下方：復古 CD / 黑膠機質感控制台 */
    footer {
      background: linear-gradient(180deg, #181b24 0%, #0d0f14 100%);
      border-top: 1px solid var(--border-color);
      padding: 16px 36px 20px;
      z-index: 20;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.7);
    }

    .deck-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    /* 仿 CD 液晶螢幕 (LCD) */
    .lcd-display {
      background: #081016;
      border: 2px solid #1e293b;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
      border-radius: 8px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: 'Orbitron', monospace;
      color: var(--lcd-green);
      min-width: 320px;
    }
    .lcd-status {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .lcd-meta {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .lcd-title {
      font-size: 0.95rem;
      font-weight: 700;
    }
    .lcd-time {
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    /* 播放進度條 */
    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 500px;
    }
    .time-tag {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      color: var(--text-sub);
    }
    .progress-track {
      flex: 1;
      height: 6px;
      background: #232733;
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--lcd-green));
      border-radius: 3px;
      width: 0%;
      position: relative;
    }

    /* 實體金屬質感按鈕群 */
    .deck-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-deck {
      background: linear-gradient(145deg, #282c37, #191b22);
      border: 1px solid #3a3f4d;
      color: #e5e7eb;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.1);
      transition: all 0.15s ease;
    }
    .btn-deck:hover {
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-2px);
    }
    .btn-deck:active {
      transform: translateY(1px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .btn-deck.btn-play {
      width: 52px;
      height: 52px;
      background: linear-gradient(145deg, #6d28d9, #4c1d95);
      border-color: #8b5cf6;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* 歌單與曲目選擇下拉/面板 */
    .playlist-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    select.deck-select {
      background: #1e222d;
      border: 1px solid #333846;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* 隱藏的 YouTube IFrame 容器 */
    #yt-hidden-player {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* 管理者模式彈出視窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #181b24;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 650px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .modal-content h3 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      color: #a78bfa;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 8px 12px;
      background: #101217;
      border: 1px solid #2d313f;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .form-group textarea {
      resize: vertical;
      height: 90px;
      font-family: monospace;
    }
    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-primary {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-secondary {
      background: #2a2e3d;
      border: none;
      color: #ccc;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .admin-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #11141b;
      margin-bottom: 6px;
      border-radius: 6px;
    }
    .btn-del {
      background: #dc2626;
      border: none;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }
  </style>

  <!-- 引入 Three.js 模組 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- 隱藏的 YouTube IFrame -->
  <div id="yt-hidden-player"></div>

  <!-- 頂部 Header -->
  <header>
    <div class="brand-title" id="logo-btn" title="雙擊或點擊可開啟管理者模式">ZY PLAYLIST</div>
    <div class="header-actions">
      <!-- 畫面不顯示密碼字樣，僅有一個低調的設定圖示或點擊標題皆可觸發 -->
      <button class="secret-admin-trigger" id="admin-trigger-btn">⚙ System</button>
    </div>
  </header>

  <!-- 主畫面 -->
  <main>
    <!-- 左側：Three.js 3D 黑膠與外殼 -->
    <div class="vinyl-stage-container">
      <div id="threejs-canvas-wrapper"></div>
      <div class="stage-hint">✦ 拖曳滑鼠可 360° 轉動視角檢視黑膠外殼</div>
    </div>

    <!-- 右側：段落同步歌詞 -->
    <div class="lyrics-container">
      <div class="lyrics-header">
        <h2 id="current-song-title">載入中...</h2>
        <p id="current-song-artist">---</p>
      </div>
      <div class="lyrics-scroller" id="lyrics-scroller">
        <div class="lyric-line">尚未播放歌曲</div>
      </div>
    </div>
  </main>

  <!-- 底部：CD / 黑膠質感操作台 -->
  <footer>
    <div class="deck-top-row">
      <!-- LCD 螢幕 -->
      <div class="lcd-display">
        <div class="lcd-status" id="lcd-status">STANDBY</div>
        <div class="lcd-meta">
          <div class="lcd-title" id="lcd-title">READY TO SPIN</div>
          <div class="lcd-time" id="lcd-time">00:00 / 00:00</div>
        </div>
      </div>

      <!-- 進度條 -->
      <div class="progress-bar-container">
        <span class="time-tag" id="current-time-label">00:00</span>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="time-tag" id="duration-label">00:00</span>
      </div>

      <!-- 播放控制按鈕 -->
      <div class="deck-controls">
        <button class="btn-deck" id="btn-prev" title="上一首">⏮</button>
        <button class="btn-deck btn-play" id="btn-play" title="播放/暫停">▶</button>
        <button class="btn-deck" id="btn-next" title="下一首">⏭</button>
      </div>

      <!-- 歌單選擇 -->
      <div class="playlist-bar">
        <select class="deck-select" id="playlist-select"></select>
        <select class="deck-select" id="track-select"></select>
      </div>
    </div>
  </footer>

  <!-- 管理者登入彈出框 (密碼 0401) -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-content" style="max-width: 360px; text-align: center;">
      <h3>管理者驗證</h3>
      <div class="form-group">
        <input type="password" id="admin-password-input" placeholder="請輸入通行密碼" autofocus>
      </div>
      <div class="modal-btns" style="justify-content: center;">
        <button class="btn-secondary" id="login-cancel-btn">取消</button>
        <button class="btn-primary" id="login-confirm-btn">確認</button>
      </div>
    </div>
  </div>

  <!-- 管理者後台控制面板 -->
  <div class="modal-overlay" id="admin-panel-modal">
    <div class="modal-content">
      <h3>歌單與歌曲管理系統</h3>

      <!-- 歌單管理 -->
      <div style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
        <h4 style="margin-bottom: 10px; color: var(--lcd-green);">1. 歌單管理</h4>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <input type="text" id="new-playlist-title" placeholder="新增歌單名稱..." style="flex:1;">
          <button class="btn-primary" id="btn-add-playlist">新增歌單</button>
        </div>
        <div id="admin-playlist-list"></div>
      </div>

      <!-- 歌曲管理 -->
      <div>
        <h4 style="margin-bottom: 10px; color: var(--lcd-green);">2. 新增歌曲至當前歌單</h4>
        <div class="form-group">
          <label>歌曲名稱</label>
          <input type="text" id="add-song-title" placeholder="例如：Whiplash">
        </div>
        <div class="form-group">
          <label>演唱者 / 專輯名稱</label>
          <input type="text" id="add-song-artist" placeholder="例如：aespa">
        </div>
        <div class="form-group">
          <label>YouTube 影片 ID 或完整網址</label>
          <input type="text" id="add-song-yt" placeholder="例如：jWQx2f-CErU 或完整 YouTube 網址">
        </div>
        <div class="form-group">
          <label>專輯外殼/黑膠封面圖片網址 (可自訂尺寸與圖片)</label>
          <input type="text" id="add-song-cover" placeholder="https://... (圖片連結)">
        </div>
        <div class="form-group">
          <label>歌詞與秒數段落 (格式：[秒數] 歌詞 或 [分:秒] 歌詞)</label>
          <textarea id="add-song-lyrics" placeholder="[00:05] One look give 'em whiplash&#10;[00:10] Beat drop with the rhythm&#10;[00:20] ..."></textarea>
        </div>
        <button class="btn-primary" id="btn-add-song" style="width: 100%;">新增此歌曲</button>
      </div>

      <div class="modal-btns">
        <button class="btn-secondary" id="btn-close-admin">關閉面板</button>
      </div>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- 主邏輯 (包含 Three.js、歌詞同步、歌單狀態) -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* =========================================================
     * 1. 預設資料庫 (LocalStorage 持久化支援)
     * ========================================================= */
    const DEFAULT_DATA = [
      {
        id: "pl_1",
        name: "aespa Favorites",
        songs: [
          {
            id: "s_1",
            title: "Whiplash",
            artist: "aespa (Winter & Karina)",
            ytId: "jWQx2f-CErU",
            cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=80",
            lyrics: [
              { time: 3, text: "One look give 'em whiplash" },
              { time: 8, text: "Beat drop with a bad girl attitude" },
              { time: 14, text: "W-H-I-P-L-A-S-H" },
              { time: 20, text: "Under the spotlight, shining bright" },
              { time: 30, text: "It's cold like Winter, sharp like steel" },
              { time: 42, text: "I'm the one who leads the vibe" },
              { time: 60, text: "Stay tuned for the grand finale" }
            ]
          },
          {
            id: "s_2",
            title: "Supernova",
            artist: "aespa",
            ytId: "phuiAIQAflA",
            cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop&q=80",
            lyrics: [
              { time: 2, text: "Supernova, explosion in the dark" },
              { time: 9, text: "I open the dimensional door" },
              { time: 16, text: "Body bang, universe colliding" },
              { time: 26, text: "Can't stop this hyper energy" },
              { time: 40, text: "Nova, can't stop the feeling" }
            ]
          }
        ]
      }
    ];

    let appData = JSON.parse(localStorage.getItem('zy_playlist_data')) || DEFAULT_DATA;
    function saveData() {
      localStorage.setItem('zy_playlist_data', JSON.stringify(appData));
    }

    let currentPlaylistIndex = 0;
    let currentSongIndex = 0;
    let isPlaying = false;
    let ytPlayer = null;
    let ytDuration = 0;
    let syncInterval = null;

    /* =========================================================
     * 2. Three.js 3D 黑膠唱片與專輯外殼場景
     * ========================================================= */
    const container = document.getElementById('threejs-canvas-wrapper');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 2.5, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 10;
    controls.minDistance = 3;

    // 燈光設置
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xa78bfa, 2.5);
    dirLight1.position.set(5, 6, 4);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 2.0);
    dirLight2.position.set(-5, -2, -4);
    scene.add(dirLight2);

    // 3D 群組物件
    const player3DGroup = new THREE.Group();
    scene.add(player3DGroup);

    // A. 專輯外殼 (Sleeve)
    const sleeveGeometry = new THREE.BoxGeometry(3.2, 3.2, 0.08);
    const sleeveTextureLoader = new THREE.TextureLoader();

    let sleeveMaterial;
    function createSleeveMaterial(url) {
      const tex = sleeveTextureLoader.load(url);
      return [
        new THREE.MeshStandardMaterial({ color: 0x1a1c23 }), // 右
        new THREE.MeshStandardMaterial({ color: 0x1a1c23 }), // 左
        new THREE.MeshStandardMaterial({ color: 0x1a1c23 }), // 上
        new THREE.MeshStandardMaterial({ color: 0x1a1c23 }), // 下
        new THREE.MeshStandardMaterial({ map: tex, roughness: 0.35, metalness: 0.1 }), // 正面
        new THREE.MeshStandardMaterial({ color: 0x111318 })  // 背面
      ];
    }
    const sleeveMesh = new THREE.Mesh(sleeveGeometry, createSleeveMaterial(appData[0].songs[0].cover));
    sleeveMesh.position.set(-0.8, 0, 0);
    player3DGroup.add(sleeveMesh);

    // B. 黑膠唱片 (Vinyl Disc)
    // 建立同心圓凹凸溝槽質感貼圖
    function generateVinylGrooveTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a0a0d';
      ctx.fillRect(0, 0, 512, 512);

      for (let r = 50; r < 250; r += 2) {
        ctx.beginPath();
        ctx.arc(256, 256, r, 0, Math.PI * 2);
        ctx.strokeStyle = (r % 4 === 0) ? '#1f222e' : '#0e1017';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      return new THREE.CanvasTexture(canvas);
    }

    const grooveTex = generateVinylGrooveTexture();
    const vinylGroup = new THREE.Group();

    // 唱片本體
    const vinylGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.03, 64);
    const vinylMat = new THREE.MeshStandardMaterial({
      color: 0x111116,
      roughness: 0.25,
      metalness: 0.85,
      bumpMap: grooveTex,
      bumpScale: 0.02
    });
    const vinylDisc = new THREE.Mesh(vinylGeo, vinylMat);
    vinylDisc.rotation.x = Math.PI / 2;
    vinylGroup.add(vinylDisc);

    // 唱片中央標籤圓標 (貼上歌曲封面)
    const labelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.035, 32);
    let labelMat = new THREE.MeshStandardMaterial({
      map: sleeveTextureLoader.load(appData[0].songs[0].cover),
      roughness: 0.4
    });
    const labelMesh = new THREE.Mesh(labelGeo, labelMat);
    labelMesh.rotation.x = Math.PI / 2;
    vinylGroup.add(labelMesh);

    // 黑膠初始位置 (部分滑出外殼呈現美感)
    const VINYL_IDLE_X = 0.9;
    const VINYL_PLAY_X = 1.35;
    vinylGroup.position.set(VINYL_IDLE_X, 0, 0.01);
    player3DGroup.add(vinylGroup);

    // 更新 3D 封面貼圖
    function update3DTextures(coverUrl) {
      sleeveTextureLoader.load(coverUrl, (tex) => {
        sleeveMesh.material[4].map = tex;
        sleeveMesh.material[4].needsUpdate = true;
        labelMesh.material.map = tex;
        labelMesh.material.needsUpdate = true;
      });
    }

    // 視窗尺寸改變
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // 3D 渲染動畫迴圈
    function render3D() {
      requestAnimationFrame(render3D);

      // 播放時，黑膠旋轉並微微向右滑出
      if (isPlaying) {
        vinylGroup.rotation.z -= 0.025;
        vinylGroup.position.x = THREE.MathUtils.lerp(vinylGroup.position.x, VINYL_PLAY_X, 0.05);
      } else {
        vinylGroup.position.x = THREE.MathUtils.lerp(vinylGroup.position.x, VINYL_IDLE_X, 0.05);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    render3D();

    /* =========================================================
     * 3. YouTube Player 初始化與整合
     * ========================================================= */
    window.onYouTubeIframeAPIReady = function() {
      const initialSong = appData[currentPlaylistIndex].songs[currentSongIndex];
      ytPlayer = new YT.Player('yt-hidden-player', {
        height: '200',
        width: '200',
        videoId: initialSong ? initialSong.ytId : '',
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'disablekb': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    };

    function onPlayerReady() {
      updateUI();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('btn-play').textContent = '⏸';
        document.getElementById('lcd-status').textContent = 'PLAYING';
        startSyncTimer();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        document.getElementById('btn-play').textContent = '▶';
        document.getElementById('lcd-status').textContent = 'PAUSED';
        stopSyncTimer();
      } else if (event.data === YT.PlayerState.ENDED) {
        playNext();
      }
    }

    /* =========================================================
     * 4. 播放控制、歌詞捲動與時間軸同步
     * ========================================================= */
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function startSyncTimer() {
      stopSyncTimer();
      syncInterval = setInterval(() => {
        if (!ytPlayer || !ytPlayer.getCurrentTime) return;
        const currentSec = ytPlayer.getCurrentTime();
        ytDuration = ytPlayer.getDuration() || 1;

        // 進度條
        const percent = (currentSec / ytDuration) * 100;
        document.getElementById('progress-fill').style.width = `${percent}%`;
        document.getElementById('current-time-label').textContent = formatTime(currentSec);
        document.getElementById('duration-label').textContent = formatTime(ytDuration);
        document.getElementById('lcd-time').textContent = `${formatTime(currentSec)} / ${formatTime(ytDuration)}`;

        // 同步歌詞
        syncLyrics(currentSec);
      }, 300);
    }

    function stopSyncTimer() {
      if (syncInterval) clearInterval(syncInterval);
    }

    function syncLyrics(currTime) {
      const song = appData[currentPlaylistIndex]?.songs[currentSongIndex];
      if (!song || !song.lyrics) return;

      let activeIndex = -1;
      for (let i = 0; i < song.lyrics.length; i++) {
        if (currTime >= song.lyrics[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      const lyricEls = document.querySelectorAll('.lyric-line');
      lyricEls.forEach((el, idx) => {
        if (idx === activeIndex) {
          if (!el.classList.contains('active')) {
            el.classList.add('active');
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        } else {
          el.classList.remove('active');
        }
      });
    }

    function renderLyrics() {
      const scroller = document.getElementById('lyrics-scroller');
      scroller.innerHTML = '';
      const song = appData[currentPlaylistIndex]?.songs[currentSongIndex];
      if (!song || !song.lyrics || song.lyrics.length === 0) {
        scroller.innerHTML = '<div class="lyric-line">純音樂 / 無歌詞資訊</div>';
        return;
      }

      song.lyrics.forEach((item, index) => {
        const line = document.createElement('div');
        line.className = 'lyric-line';
        line.textContent = item.text;
        line.onclick = () => {
          if (ytPlayer && ytPlayer.seekTo) {
            ytPlayer.seekTo(item.time, true);
          }
        };
        scroller.appendChild(line);
      });
    }

    function updateUI() {
      const currentPlaylist = appData[currentPlaylistIndex];
      const currentSong = currentPlaylist?.songs[currentSongIndex];

      if (!currentSong) return;

      document.getElementById('current-song-title').textContent = currentSong.title;
      document.getElementById('current-song-artist').textContent = currentSong.artist;
      document.getElementById('lcd-title').textContent = `${currentSong.title} - ${currentSong.artist}`;

      // 更新 Three.js 貼圖
      update3DTextures(currentSong.cover);

      // 更新歌詞
      renderLyrics();

      // 更新選單
      updateSelectOptions();
    }

    function playSong(playlistIdx, songIdx) {
      currentPlaylistIndex = playlistIdx;
      currentSongIndex = songIdx;
      const song = appData[currentPlaylistIndex]?.songs[currentSongIndex];
      if (!song) return;

      updateUI();
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(song.ytId);
        isPlaying = true;
      }
    }

    function playNext() {
      const playlist = appData[currentPlaylistIndex];
      if (!playlist) return;
      let nextIndex = currentSongIndex + 1;
      if (nextIndex >= playlist.songs.length) nextIndex = 0;
      playSong(currentPlaylistIndex, nextIndex);
    }

    function playPrev() {
      const playlist = appData[currentPlaylistIndex];
      if (!playlist) return;
      let prevIndex = currentSongIndex - 1;
      if (prevIndex < 0) prevIndex = playlist.songs.length - 1;
      playSong(currentPlaylistIndex, prevIndex);
    }

    // 按鈕監聽事件
    document.getElementById('btn-play').addEventListener('click', () => {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    });

    document.getElementById('btn-next').addEventListener('click', playNext);
    document.getElementById('btn-prev').addEventListener('click', playPrev);

    // 進度條點擊跳轉 (Seek)
    document.getElementById('progress-track').addEventListener('click', (e) => {
      if (!ytPlayer || !ytDuration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = clickX / rect.width;
      ytPlayer.seekTo(ratio * ytDuration, true);
    });

    // 歌單與曲目下拉更新
    function updateSelectOptions() {
      const pSelect = document.getElementById('playlist-select');
      pSelect.innerHTML = '';
      appData.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `📁 ${p.name}`;
        if (idx === currentPlaylistIndex) opt.selected = true;
        pSelect.appendChild(opt);
      });

      const tSelect = document.getElementById('track-select');
      tSelect.innerHTML = '';
      const currentSongs = appData[currentPlaylistIndex]?.songs || [];
      currentSongs.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `🎵 ${s.title}`;
        if (idx === currentSongIndex) opt.selected = true;
        tSelect.appendChild(opt);
      });
    }

    document.getElementById('playlist-select').addEventListener('change', (e) => {
      currentPlaylistIndex = parseInt(e.target.value);
      playSong(currentPlaylistIndex, 0);
    });

    document.getElementById('track-select').addEventListener('change', (e) => {
      playSong(currentPlaylistIndex, parseInt(e.target.value));
    });

    /* =========================================================
     * 5. 管理者模式 (密碼 0401) 與 資料增刪改查
     * ========================================================= */
    const loginModal = document.getElementById('login-modal');
    const adminPanelModal = document.getElementById('admin-panel-modal');
    const passwordInput = document.getElementById('admin-password-input');

    function openLogin() {
      passwordInput.value = '';
      loginModal.style.display = 'flex';
      passwordInput.focus();
    }

    document.getElementById('logo-btn').addEventListener('click', openLogin);
    document.getElementById('admin-trigger-btn').addEventListener('click', openLogin);

    document.getElementById('login-cancel-btn').addEventListener('click', () => {
      loginModal.style.display = 'none';
    });

    document.getElementById('login-confirm-btn').addEventListener('click', () => {
      if (passwordInput.value === '0401') {
        loginModal.style.display = 'none';
        adminPanelModal.style.display = 'flex';
        renderAdminLists();
      } else {
        alert('密碼錯誤！');
      }
    });

    document.getElementById('btn-close-admin').addEventListener('click', () => {
      adminPanelModal.style.display = 'none';
      saveData();
      updateUI();
    });

    // 渲染管理清單
    function renderAdminLists() {
      const container = document.getElementById('admin-playlist-list');
      container.innerHTML = '';

      appData.forEach((pl, pIdx) => {
        const div = document.createElement('div');
        div.className = 'admin-list-item';
        div.innerHTML = `
          <div><strong>${pl.name}</strong> (${pl.songs.length} 首歌)</div>
          <div>
            <button class="btn-del" data-pidx="${pIdx}">刪除歌單</button>
          </div>
        `;
        container.appendChild(div);

        // 該歌單下的歌曲細項
        pl.songs.forEach((sg, sIdx) => {
          const songDiv = document.createElement('div');
          songDiv.style.cssText = "display:flex; justify-content:space-between; padding:4px 12px 4px 24px; font-size:0.8rem; color:#aaa;";
          songDiv.innerHTML = `
            <span>↳ ${sg.title} - ${sg.artist}</span>
            <button class="btn-del" style="background:#555;" data-pidx="${pIdx}" data-sidx="${sIdx}">刪除歌曲</button>
          `;
          container.appendChild(songDiv);
        });
      });

      // 綁定刪除事件
      container.querySelectorAll('.btn-del').forEach(btn => {
        btn.onclick = (e) => {
          const pIdx = e.target.getAttribute('data-pidx');
          const sIdx = e.target.getAttribute('data-sidx');

          if (sIdx !== null) {
            // 刪除歌曲
            appData[pIdx].songs.splice(sIdx, 1);
          } else {
            // 刪除歌單
            if (appData.length <= 1) {
              alert('至少需保留一個歌單！');
              return;
            }
            appData.splice(pIdx, 1);
            if (currentPlaylistIndex >= appData.length) currentPlaylistIndex = 0;
          }
          saveData();
          renderAdminLists();
          updateUI();
        };
      });
    }

    // 新增歌單
    document.getElementById('btn-add-playlist').addEventListener('click', () => {
      const title = document.getElementById('new-playlist-title').value.trim();
      if (!title) return alert('請輸入歌單名稱');
      appData.push({
        id: 'pl_' + Date.now(),
        name: title,
        songs: []
      });
      document.getElementById('new-playlist-title').value = '';
      saveData();
      renderAdminLists();
      updateUI();
    });

    // 解析 YouTube 網址取得 ID
    function extractYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    // 解析自訂格式歌詞: [00:15] 歌詞內容 或 [15] 歌詞內容
    function parseLyricsText(text) {
      if (!text.trim()) return [];
      const lines = text.split('\n');
      const parsed = [];
      lines.forEach(l => {
        const match = l.match(/\[(\d+)(?::(\d+))?\]\s*(.*)/);
        if (match) {
          let time = 0;
          if (match[2] !== undefined) {
            time = parseInt(match[1]) * 60 + parseFloat(match[2]);
          } else {
            time = parseFloat(match[1]);
          }
          parsed.push({ time, text: match[3] || '' });
        }
      });
      return parsed.sort((a, b) => a.time - b.time);
    }

    // 新增歌曲
    document.getElementById('btn-add-song').addEventListener('click', () => {
      const title = document.getElementById('add-song-title').value.trim();
      const artist = document.getElementById('add-song-artist').value.trim() || 'Unknown';
      const ytRaw = document.getElementById('add-song-yt').value.trim();
      const cover = document.getElementById('add-song-cover').value.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800';
      const lyricsRaw = document.getElementById('add-song-lyrics').value;

      if (!title || !ytRaw) {
        alert('請填寫完整歌曲名稱與 YouTube 連結！');
        return;
      }

      const songObj = {
        id: 's_' + Date.now(),
        title,
        artist,
        ytId: extractYouTubeId(ytRaw),
        cover,
        lyrics: parseLyricsText(lyricsRaw)
      };

      appData[currentPlaylistIndex].songs.push(songObj);
      saveData();
      renderAdminLists();
      updateUI();
      alert(`已成功新增歌曲《${title}》！`);

      // 清空輸入框
      document.getElementById('add-song-title').value = '';
      document.getElementById('add-song-artist').value = '';
      document.getElementById('add-song-yt').value = '';
      document.getElementById('add-song-cover').value = '';
      document.getElementById('add-song-lyrics').value = '';
    });

    // 初始化介面
    updateUI();
  </script>
</body>
</html>
