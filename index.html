<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <title>zy playlist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Syne:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --steel: #e4e4e7;
      --steel-dim: #71717a;
      --steel-border: #27272a;
      --accent-glow: rgba(228, 228, 231, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000000 !important;
      color: var(--steel);
      font-family: 'Syne', 'Noto Sans TC', sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 頂部 Header */
    header {
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, transparent 100%);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #f4f4f5;
      cursor: pointer;
    }

    .admin-dot-btn {
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      gap: 4px;
      padding: 8px;
    }
    .admin-dot-btn span {
      width: 4px;
      height: 4px;
      background: #52525b;
      border-radius: 50%;
    }

    /* 主舞台 (加入深色微光漸層，烘托黑膠輪廓) */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 28%, #1c1d24 0%, #0d0e12 45%, #000000 85%);
    }

    #threejs-box {
      width: 100%;
      height: 52%;
      position: relative;
      cursor: grab;
    }
    #threejs-box:active {
      cursor: grabbing;
    }

    /* 歌曲資訊與歌詞區 */
    .info-lyrics-container {
      height: 48%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding: 0 16px;
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .track-meta {
      text-align: center;
      margin-bottom: 4px;
      z-index: 10;
    }
    .track-meta h1 {
      font-family: 'Orbitron', 'Syne', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #fafafa;
    }
    .track-meta p {
      font-size: 0.8rem;
      color: #a1a1aa;
      margin-top: 2px;
    }

    .lyrics-view {
      width: 100%;
      max-width: 600px;
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 30px 16px 80px;
      scrollbar-width: none;
    }
    .lyrics-view::-webkit-scrollbar {
      display: none;
    }

    .lyric-row {
      text-align: center;
      font-size: 0.95rem;
      color: #3f3f46;
      line-height: 1.6;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .lyric-row.active {
      color: #f4f4f5;
      font-size: 1.15rem;
      font-weight: 600;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
      transform: scale(1.04);
    }

    /* 底部面板：防 Safari 遮擋且緊湊排版 */
    footer.retro-deck {
      background: linear-gradient(180deg, #101115 0%, #000000 100%);
      border-top: 1px solid var(--steel-border);
      padding: 8px 12px calc(26px + env(safe-area-inset-bottom, 20px));
      box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
      z-index: 25;
      width: 100%;
    }

    .timeline-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto 10px;
      padding: 0 4px;
    }
    .retro-time {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: #a1a1aa;
      min-width: 36px;
    }

    /* 滑動進度條 */
    .seek-groove {
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
      touch-action: none;
    }
    .seek-track {
      width: 100%;
      height: 4px;
      background: #1e1e24;
      border-radius: 2px;
      position: relative;
    }
    .seek-bar {
      height: 100%;
      background: linear-gradient(90deg, #52525b, #e4e4e7);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
      position: relative;
    }
    .seek-thumb {
      position: absolute;
      right: -5px;
      top: -4px;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
      pointer-events: none;
    }

    /* 控制列：緊湊響應式 */
    .deck-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 480px;
      margin: 0 auto;
      gap: 6px;
      padding: 0 2px;
    }

    /* 下拉選單 */
    .steel-select-group {
      display: flex;
      gap: 5px;
      flex-shrink: 1;
      min-width: 0;
    }
    .steel-select {
      background: #14151b;
      border: 1px solid #2d2f3a;
      color: #d4d4d8;
      font-size: 0.7rem;
      padding: 5px 6px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      width: 82px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    /* 按鍵區 */
    .buttons-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .steel-knob-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #27272a 0%, #121215 100%);
      border: 1px solid #3f3f46;
      box-shadow: 0 3px 6px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .steel-knob-btn:active {
      transform: scale(0.92);
    }
    .steel-knob-btn svg {
      width: 14px;
      height: 14px;
      fill: #a1a1aa;
    }

    .play-master-btn {
      width: 46px;
      height: 46px;
      background: radial-gradient(circle at 35% 35%, #3f3f46 0%, #18181b 100%);
      border: 1.5px solid #71717a;
      box-shadow: 0 0 10px var(--accent-glow), inset 0 1px 2px rgba(255,255,255,0.2);
    }
    .play-master-btn svg {
      width: 17px;
      height: 17px;
      fill: #fafafa;
    }

    /* 彈窗樣式 */
    .modal-veil {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-inner {
      background: #111216;
      border: 1px solid #27272a;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .modal-inner h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      color: #f4f4f5;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .field-row {
      margin-bottom: 12px;
    }
    .field-row label {
      display: block;
      font-size: 0.78rem;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    .field-row input, .field-row textarea, .field-row select {
      width: 100%;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 10px;
      outline: none;
    }
    .field-row textarea {
      font-family: monospace;
      font-size: 0.78rem;
      resize: vertical;
    }
    .btn-steel {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #fafafa;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid #27272a;
      color: #71717a;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .song-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #09090b;
      border: 1px solid #1f1f23;
      margin-bottom: 4px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .song-actions {
      display: flex;
      gap: 6px;
    }
    .btn-act {
      border: none;
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-edit { background: #3f3f46; color: #fff; }
    .btn-del { background: #7f1d1d; color: #fca5a5; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- 音訊引擎：本機 audio 與 背景 YouTube 串流 -->
  <audio id="native-audio" playsinline preload="auto"></audio>
  <iframe id="yt-hidden-player" style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px;" frameborder="0" allow="autoplay; encrypted-media"></iframe>

  <!-- Header -->
  <header>
    <div class="brand-title" id="logo-trigger">ZY PLAYLIST</div>
    <button class="admin-dot-btn" id="btn-open-auth" title="Settings">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- 3D 與歌詞舞台 -->
  <main>
    <div id="threejs-box"></div>
    <div class="info-lyrics-container">
      <div class="track-meta">
        <h1 id="disp-title">載入中...</h1>
        <p id="disp-artist">---</p>
      </div>
      <div class="lyrics-view" id="lyrics-scroller"></div>
    </div>
  </main>

  <!-- 底部面板 -->
  <footer class="retro-deck">
    <div class="timeline-strip">
      <span class="retro-time" id="lbl-curr">00:00</span>
      <div class="seek-groove" id="seek-container">
        <div class="seek-track">
          <div class="seek-bar" id="seek-progress">
            <div class="seek-thumb"></div>
          </div>
        </div>
      </div>
      <span class="retro-time" id="lbl-total">00:00</span>
    </div>

    <div class="deck-controls">
      <div class="steel-select-group">
        <select class="steel-select" id="sel-playlist"></select>
        <select class="steel-select" id="sel-song"></select>
      </div>

      <div class="buttons-group">
        <button class="steel-knob-btn" id="btn-prev" title="上一首">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="steel-knob-btn play-master-btn" id="btn-play" title="播放 / 暫停">
          <svg id="play-svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="steel-knob-btn" id="btn-next" title="下一首">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- 密碼驗證視窗 (不出現密碼 0401) -->
  <div class="modal-veil" id="auth-modal">
    <div class="modal-inner" style="max-width: 300px; text-align: center;">
      <h3>System Access</h3>
      <div class="field-row" style="margin-top: 14px;">
        <input type="password" id="auth-input" placeholder="請輸入管理密碼" autocomplete="off">
      </div>
      <div style="display:flex; justify-content:center; gap:8px; margin-top:14px;">
        <button class="btn-cancel" id="btn-auth-close">取消</button>
        <button class="btn-steel" id="btn-auth-submit">驗證</button>
      </div>
    </div>
  </div>

  <!-- 後台管理系統 -->
  <div class="modal-veil" id="admin-modal">
    <div class="modal-inner">
      <h3>歌單與曲目核心管理</h3>

      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="btn-steel" id="btn-copy-code" style="flex:1; font-size:0.75rem;">📋 複製當前更新程式碼</button>
        <button class="btn-cancel" id="btn-dl-html" style="font-size:0.75rem;">💾 下載更新 HTML</button>
      </div>

      <div style="background:#09090b; padding:10px; border-radius:6px; border:1px solid #1f1f23; margin-bottom:12px;">
        <label style="font-size:0.75rem; color:#a1a1aa; display:flex; justify-content:space-between;">
          <span>黑膠與封面尺寸縮放</span>
          <span id="scale-val-lbl">1.0x</span>
        </label>
        <input type="range" id="scale-slider" min="0.6" max="1.5" step="0.05" value="1.0" style="width:100%; margin-top:6px;">
      </div>

      <div style="background:#09090b; padding:10px; border-radius:6px; border:1px solid #1f1f23; margin-bottom:12px;">
        <label style="font-size:0.78rem; color:#e4e4e7; font-weight:bold;">新增歌單</label>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <input type="text" id="admin-new-pl-name" placeholder="歌單名稱...">
          <button class="btn-steel" id="btn-add-pl">新增</button>
        </div>
      </div>

      <div style="background:#09090b; padding:12px; border-radius:6px; border:1px solid #1f1f23; margin-bottom:12px;">
        <h4 id="form-mode-title" style="color:#fafafa; font-size:0.85rem; margin-bottom:8px;">✦ 新增歌曲</h4>
        <input type="hidden" id="edit-song-id" value="">

        <div class="field-row">
          <label>所屬歌單</label>
          <select id="form-pl-target"></select>
        </div>
        <div class="field-row">
          <label>歌曲名稱</label>
          <input type="text" id="form-song-title" placeholder="例如：Lips">
        </div>
        <div class="field-row">
          <label>演唱者 / 專輯名稱</label>
          <input type="text" id="form-song-artist" placeholder="例如：Winter">
        </div>
        <div class="field-row">
          <label>音訊來源 (本機檔名、GitHub 網址 或 YouTube 連結)</label>
          <input type="text" id="form-song-source" placeholder="如：lips (online-audio-converter.com).mp3 或 YouTube 網址">
        </div>

        <div class="field-row">
          <label>專輯封面 (正面)</label>
          <input type="text" id="form-song-cover" placeholder="貼上圖片網址（自動轉直連）">
          <div style="margin-top:6px; display:flex; align-items:center; gap:8px;">
            <input type="file" id="local-img-picker" accept="image/*" style="display:none;">
            <button type="button" class="btn-cancel" onclick="document.getElementById('local-img-picker').click()" style="font-size:0.72rem;">📁 從手機圖庫挑選正面</button>
            <span id="img-picker-status" style="font-size:0.72rem; color:#71717a;"></span>
          </div>
        </div>

        <!-- 獨立專輯背面圖片設定 -->
        <div class="field-row">
          <label>專輯外殼 (背面，留空則預設同正面)</label>
          <input type="text" id="form-song-back-cover" placeholder="留空則預設跟正面相同">
          <div style="margin-top:6px; display:flex; align-items:center; gap:8px;">
            <input type="file" id="local-back-img-picker" accept="image/*" style="display:none;">
            <button type="button" class="btn-cancel" onclick="document.getElementById('local-back-img-picker').click()" style="font-size:0.72rem;">📁 從手機圖庫挑選背面</button>
            <span id="back-img-picker-status" style="font-size:0.72rem; color:#71717a;"></span>
          </div>
        </div>

        <div class="field-row">
          <label>動態歌詞 (支援 [分:秒] 或 [秒數])</label>
          <textarea id="form-song-lyrics" rows="4" placeholder="[00:03] 歌詞第一句&#10;[00:08] 歌詞第二句"></textarea>
        </div>

        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn-steel" id="btn-save-song" style="flex:1;">儲存歌曲</button>
          <button class="btn-cancel" id="btn-cancel-edit" style="display:none;">取消編輯</button>
        </div>
      </div>

      <div>
        <label style="font-size:0.75rem; color:#71717a; margin-bottom:6px; display:block;">歌單與歌曲細項</label>
        <div id="admin-tree-view"></div>
      </div>

      <div style="text-align:right; margin-top:14px;">
        <button class="btn-cancel" id="btn-close-admin">關閉管理後台</button>
      </div>
    </div>
  </div>

    let store = JSON.parse(localStorage.getItem('zy_playlist_v8_depth')) || DEFAULT_DATA;

    let plIdx = 0;

    const nativeAudio = document.getElementById('native-audio');

    /* -------------------------------------------------------------
     * 2. 網址解析
     * ------------------------------------------------------------*/
    function normalizeImageUrl(url) {
      if (!url) return '';
      url = url.trim();
      const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                         url.match(/id=([a-zA-Z0-9_-]+)/) || 
                         url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch) return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
      if (url.includes('dropbox.com')) return url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
      if (url.includes('imgur.com') && !url.includes('i.imgur.com')) {
        const id = url.split('/').pop().split('.')[0];
        return `https://i.imgur.com/${id}.jpg`;
      }
      if (url.includes('github.com') && url.includes('/blob/')) {
        return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
      }
      return url;
    }

    function extractYoutubeId(url) {
      if (!url) return null;
      if (url.includes("v=")) return url.split("v=")[1].substring(0, 11);
      if (url.includes("youtu.be/")) return url.split("youtu.be/")[1].substring(0, 11);
      if (url.length === 11 && !url.includes("/") && !url.includes(".")) return url.trim();
      return null;
    }

    /* -------------------------------------------------------------
     * 3. Three.js 3D (修復純旋轉無平移卡死、光澤同心圓溝槽、平滑回正)
     * ------------------------------------------------------------*/
    const container = document.getElementById('threejs-box');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 0.2, 5.8);

    function resizeCamera() {
      const isMobile = window.innerWidth < 600;
      DEFAULT_CAM_POS.set(0, isMobile ? 0.2 : 0.4, isMobile ? 5.8 : 5.0);
      camera.position.copy(DEFAULT_CAM_POS);
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = false;
    controls.enablePan = false; // 徹底關閉平移，修復「只能平移無法旋轉」的問題
    controls.touches.ONE = THREE.TOUCH.ROTATE; // 強制單指為 3D 旋轉

    // 均勻清晰白光
    const ambLight = new THREE.AmbientLight(0xffffff, 4.0);
    scene.add(ambLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 3.2);
    dirLight.position.set(5, 8, 6);
    scene.add(dirLight);

    // 側邊補光，使黑膠邊框明顯浮現
    const sideLight = new THREE.DirectionalLight(0x71717a, 2.0);
    sideLight.position.set(-6, 2, 4);
    scene.add(sideLight);

    const turntableGroup = new THREE.Group();
    turntableGroup.scale.set(modelScale, modelScale, modelScale);
    scene.add(turntableGroup);

    // 黑膠同心圓高對比紋理貼圖
    function createBrightVinylTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1c1d22';
      ctx.fillRect(0, 0, 512, 512);
      for (let r = 35; r < 250; r += 2) {
        ctx.beginPath();
        ctx.arc(256, 256, r, 0, Math.PI * 2);
        ctx.strokeStyle = (r % 4 === 0) ? '#525463' : '#2d2f38'; // 明顯立體溝槽反光
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

    const texLoader = new THREE.TextureLoader();

    // 專輯外殼（正面 4，背面 5）
    const coverGeo = new THREE.BoxGeometry(2.2, 2.2, 0.05);
    const coverMesh = new THREE.Mesh(coverGeo, [
      new THREE.MeshBasicMaterial({ color: 0x1f2026 }), // 右
      new THREE.MeshBasicMaterial({ color: 0x1f2026 }), // 左
      new THREE.MeshBasicMaterial({ color: 0x1f2026 }), // 上
      new THREE.MeshBasicMaterial({ color: 0x1f2026 }), // 下
      new THREE.MeshBasicMaterial({ color: 0xffffff }), // 正面
      new THREE.MeshBasicMaterial({ color: 0xffffff })  // 背面 (預設同正面)
    ]);
    coverMesh.position.set(-0.55, 0, 0);
    turntableGroup.add(coverMesh);

    // 唱片本體
    const discGroup = new THREE.Group();
    const discGeo = new THREE.CylinderGeometry(1.05, 1.05, 0.02, 64);
    const discMat = new THREE.MeshStandardMaterial({
      color: 0x272830,          // 具厚重金屬灰的高質感黑膠
      roughness: 0.15,
      metalness: 0.85,
      bumpMap: createBrightVinylTexture(),
      bumpScale: 0.028
    });
    const discMesh = new THREE.Mesh(discGeo, discMat);
    discMesh.rotation.x = Math.PI / 2;
    discGroup.add(discMesh);

    // 唱片中央貼標
    const labelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.025, 32);
    const labelMesh = new THREE.Mesh(labelGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    labelMesh.rotation.x = Math.PI / 2;
    discGroup.add(labelMesh);

    const VINYL_REST_X = 0.55;
    const VINYL_OUT_X = 0.98;
    discGroup.position.set(VINYL_REST_X, 0, 0.01);
    turntableGroup.add(discGroup);

    // 更新封面與背面
    function applyCoverTo3D(frontUrl, backUrl) {
      if (!frontUrl) return;
      const directFront = normalizeImageUrl(frontUrl);
      const directBack = backUrl ? normalizeImageUrl(backUrl) : directFront;

      texLoader.load(directFront, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        coverMesh.material[4].map = tex;
        coverMesh.material[4].needsUpdate = true;
        labelMesh.material.map = tex;
        labelMesh.material.needsUpdate = true;
      });

      texLoader.load(directBack, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        coverMesh.material[5].map = tex;
        coverMesh.material[5].needsUpdate = true;
      });
    }

    // 平滑重設視角至標準位置
    let shouldResetView = false;
    function triggerResetView() {
      shouldResetView = true;
    }

    // 點擊 3D 畫面時自動恢復預設視角
    renderer.domElement.addEventListener('click', () => {
      triggerResetView();
    });

    window.addEventListener('resize', resizeCamera);
    resizeCamera();

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      // 當觸發重設時，平滑插值插回正中央標準位置
      if (shouldResetView) {
        camera.position.lerp(DEFAULT_CAM_POS, 0.08);
        controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.08);
        if (camera.position.distanceTo(DEFAULT_CAM_POS) < 0.02) {
          camera.position.copy(DEFAULT_CAM_POS);
          controls.target.set(0, 0, 0);
          shouldResetView = false;
        }
      }

      if (isPlaying) {
        discGroup.rotation.z -= 0.025;
        discGroup.position.x = THREE.MathUtils.lerp(discGroup.position.x, VINYL_OUT_X, 0.06);
      } else {
        discGroup.position.x = THREE.MathUtils.lerp(discGroup.position.x, VINYL_REST_X, 0.06);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    renderLoop();

    /* -------------------------------------------------------------
     * 4. 跨專案音訊串流 (自動尋找 winter-cd-player 音訊檔)
     * ------------------------------------------------------------*/
    function setPlayState(active) {
      isPlaying = active;
      const svg = document.getElementById('play-svg-icon');
      if (active) {
        svg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        svg.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function formatTime(sec) {
      sec = Math.floor(sec) || 0;
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function updateProgressUI(cur, total) {
      currentSec = cur;
      totalDuration = total || 211;
      const pct = Math.min(100, Math.max(0, (cur / totalDuration) * 100));
      document.getElementById('seek-progress').style.width = `${pct}%`;
      document.getElementById('lbl-curr').textContent = formatTime(cur);
      document.getElementById('lbl-total').textContent = formatTime(totalDuration);
      syncLyrics(cur);
    }

    nativeAudio.addEventListener('timeupdate', () => {
      if (playMode !== 'file' || isDraggingSeek) return;
      updateProgressUI(nativeAudio.currentTime, nativeAudio.duration || totalDuration);
    });
    nativeAudio.addEventListener('playing', () => setPlayState(true));
    nativeAudio.addEventListener('pause', () => setPlayState(false));
    nativeAudio.addEventListener('ended', () => playNext());

    function startYtProgressTimer() {
      clearInterval(ytTimer);
      ytTimer = setInterval(() => {
        if (!isPlaying || playMode !== 'yt' || isDraggingSeek) return;
        currentSec++;
        updateProgressUI(currentSec, totalDuration);
        if (currentSec >= totalDuration) {
          playNext();
        }
      }, 1000);
    }

    function playActiveSong() {
      const curPl = store[plIdx];
      if (!curPl || !curPl.songs[trackIdx]) return;
      const song = curPl.songs[trackIdx];

      renderUI();
      triggerResetView(); // 換歌自動平滑回正 3D 視角

      totalDuration = song.duration || 211;
      const ytId = extractYoutubeId(song.source);

      if (ytId) {
        playMode = 'yt';
        nativeAudio.pause();
        nativeAudio.removeAttribute('src');

        const startSec = Math.floor(currentSec || 0);
        ytIframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&start=${startSec}&playsinline=1&controls=0&enablejsapi=1`;
        setPlayState(true);
        startYtProgressTimer();
      } else {
        playMode = 'file';
        clearInterval(ytTimer);
        ytIframe.src = '';

        let directSrc = song.source.replace(/^\.\//, '');
        if (!directSrc.startsWith('http')) {
          directSrc = CD_PROJECT_BASE + encodeURI(directSrc);
        } else if (directSrc.includes('github.com') && directSrc.includes('/blob/')) {
          directSrc = directSrc.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        }

        nativeAudio.muted = false;
        nativeAudio.volume = 1.0;

        if (!nativeAudio.src.endsWith(directSrc)) {
          nativeAudio.src = directSrc;
          nativeAudio.load();
        }

        if (currentSec > 0 && Math.abs(nativeAudio.currentTime - currentSec) > 1) {
          nativeAudio.currentTime = currentSec;
        }

        const p = nativeAudio.play();
        if (p !== undefined) {
          p.then(() => setPlayState(true)).catch(err => {
            console.log("等待手勢點擊播放:", err);
            setPlayState(false);
          });
        }
      }
    }

    function pauseActiveSong() {
      setPlayState(false);
      if (playMode === 'file') {
        currentSec = nativeAudio.currentTime;
        nativeAudio.pause();
      } else {
        clearInterval(ytTimer);
        ytIframe.src = '';
      }
    }

    /* -------------------------------------------------------------
     * 5. 手指滑動進度條 (Touch & Seek)
     * ------------------------------------------------------------*/
    const seekContainer = document.getElementById('seek-container');
    const seekProgress = document.getElementById('seek-progress');

    function getSeekFraction(e) {
      const rect = seekContainer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pos = clientX - rect.left;
      return Math.min(1, Math.max(0, pos / rect.width));
    }

    function handleSeekMove(e) {
      if (!isDraggingSeek) return;
      const frac = getSeekFraction(e);
      seekProgress.style.width = `${frac * 100}%`;
      document.getElementById('lbl-curr').textContent = formatTime(frac * totalDuration);
    }

    function handleSeekEnd(e) {
      if (!isDraggingSeek) return;
      isDraggingSeek = false;
      const frac = getSeekFraction(e.changedTouches ? e.changedTouches[0] : e);
      currentSec = frac * totalDuration;

      if (playMode === 'file') {
        nativeAudio.currentTime = currentSec;
      } else {
        if (isPlaying) playActiveSong();
      }
      updateProgressUI(currentSec, totalDuration);
    }

    seekContainer.addEventListener('mousedown', (e) => { isDraggingSeek = true; handleSeekMove(e); });
    window.addEventListener('mousemove', handleSeekMove);
    window.addEventListener('mouseup', handleSeekEnd);

    seekContainer.addEventListener('touchstart', (e) => { isDraggingSeek = true; handleSeekMove(e); }, { passive: false });
    window.addEventListener('touchmove', handleSeekMove, { passive: false });
    window.addEventListener('touchend', handleSeekEnd);

    /* -------------------------------------------------------------
     * 6. 歌詞與切換渲染
     * ------------------------------------------------------------*/
    function syncLyrics(sec) {
      const song = store[plIdx]?.songs[trackIdx];
      if (!song || !song.lyrics) return;

      let idx = -1;
      for (let i = 0; i < song.lyrics.length; i++) {
        if (sec >= song.lyrics[i].time) idx = i;
        else break;
      }

      const rows = document.querySelectorAll('.lyric-row');
      rows.forEach((r, i) => {
        if (i === idx) {
          if (!r.classList.contains('active')) {
            r.classList.add('active');
            const scroller = document.getElementById('lyrics-scroller');
            scroller.scrollTo({ top: r.offsetTop - (scroller.clientHeight / 2) + 10, behavior: 'smooth' });
          }
        } else {
          r.classList.remove('active');
        }
      });
    }

    function renderLyricsList() {
      const scroller = document.getElementById('lyrics-scroller');
      scroller.innerHTML = '';
      const song = store[plIdx]?.songs[trackIdx];

      if (!song || !song.lyrics || song.lyrics.length === 0) {
        scroller.innerHTML = '<div class="lyric-row">純音樂 / Instrumental</div>';
        return;
      }

      song.lyrics.forEach(l => {
        const div = document.createElement('div');
        div.className = 'lyric-row';
        div.textContent = l.text;
        div.onclick = () => {
          currentSec = l.time;
          if (playMode === 'file') nativeAudio.currentTime = currentSec;
          else playActiveSong();
        };
        scroller.appendChild(div);
      });
    }

    function renderUI() {
      const curPl = store[plIdx];
      const song = curPl?.songs[trackIdx];
      if (!song) return;

      document.getElementById('disp-title').textContent = song.title;
      document.getElementById('disp-artist').textContent = song.artist;

      applyCoverTo3D(song.cover || curPl.cover, song.backCover);
      renderLyricsList();
      populateDropdowns();
    }

    function playNext() {
      const pl = store[plIdx];
      if (!pl || pl.songs.length === 0) return;
      trackIdx = (trackIdx + 1) % pl.songs.length;
      currentSec = 0;
      playActiveSong();
    }

    function playPrev() {
      const pl = store[plIdx];
      if (!pl || pl.songs.length === 0) return;
      trackIdx = (trackIdx - 1 + pl.songs.length) % pl.songs.length;
      currentSec = 0;
      playActiveSong();
    }

    document.getElementById('btn-play').onclick = () => {
      if (isPlaying) pauseActiveSong();
      else playActiveSong();
    };
    document.getElementById('btn-next').onclick = playNext;
    document.getElementById('btn-prev').onclick = playPrev;

    function populateDropdowns() {
      const pSel = document.getElementById('sel-playlist');
      pSel.innerHTML = '';
      store.forEach((p, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = p.name;
        if (i === plIdx) opt.selected = true;
        pSel.appendChild(opt);
      });

      const sSel = document.getElementById('sel-song');
      sSel.innerHTML = '';
      const songs = store[plIdx]?.songs || [];
      songs.forEach((s, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = s.title;
        if (i === trackIdx) opt.selected = true;
        sSel.appendChild(opt);
      });
    }

    document.getElementById('sel-playlist').onchange = (e) => {
      plIdx = parseInt(e.target.value);
      trackIdx = 0;
      currentSec = 0;
      playActiveSong();
    };
    document.getElementById('sel-song').onchange = (e) => {
      trackIdx = parseInt(e.target.value);
      currentSec = 0;
      playActiveSong();
    };

      modelScale = parseFloat(e.target.value);
      document.getElementById('scale-val-lbl').textContent = `${modelScale}x`;
      turntableGroup.scale.set(modelScale, modelScale, modelScale);
    };

    // 正面圖片
    document.getElementById('local-img-picker').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        document.getElementById('form-song-cover').value = event.target.result;
        document.getElementById('img-picker-status').textContent = `已載入: ${file.name}`;
      };
      reader.readAsDataURL(file);
    };

    // 背面圖片
    document.getElementById('local-back-img-picker').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        document.getElementById('form-song-back-cover').value = event.target.result;
        document.getElementById('back-img-picker-status').textContent = `已載入: ${file.name}`;
      };
      reader.readAsDataURL(file);
    };

    function renderAdminUI() {
      const targetPlSel = document.getElementById('form-pl-target');
      targetPlSel.innerHTML = '';
      store.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = p.name;
        targetPlSel.appendChild(opt);
      });

      const tree = document.getElementById('admin-tree-view');
      tree.innerHTML = '';
      store.forEach((p, pI) => {
        const pBox = document.createElement('div');
        pBox.style.cssText = "margin-bottom:10px; background:#0e0f13; padding:8px; border-radius:6px; border:1px solid #1f2026;";
        pBox.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="color:#e4e4e7; font-size:0.82rem;">📁 ${p.name} (${p.songs.length})</strong>
            <button class="btn-act btn-del" onclick="deletePlaylist(${pI})">刪除歌單</button>
          </div>
        `;

        p.songs.forEach((s, sI) => {
          const sRow = document.createElement('div');
          sRow.className = 'song-item-row';
          sRow.innerHTML = `
            <span>🎵 ${s.title}</span>
            <div class="song-actions">
              <button class="btn-act btn-edit" onclick="editSong(${pI}, ${sI})">編輯 ✎</button>
              <button class="btn-act btn-del" onclick="deleteSong(${pI}, ${sI})">刪除</button>
            </div>
          `;
          pBox.appendChild(sRow);
        });
        tree.appendChild(pBox);
      });
    }

    window.deletePlaylist = function(pI) {
      if (store.length <= 1) return alert('請至少保留一個歌單！');
      if (confirm(`確定刪除歌單《${store[pI].name}》？`)) {
        store.splice(pI, 1);
        if (plIdx >= store.length) plIdx = 0;
        persistData();
        renderAdminUI();
        renderUI();
      }
    };

    window.deleteSong = function(pI, sI) {
      store[pI].songs.splice(sI, 1);
      persistData();
      renderAdminUI();
      renderUI();
    };

    window.editSong = function(pI, sI) {
      const s = store[pI].songs[sI];
      document.getElementById('form-mode-title').textContent = `✦ 編輯歌曲: ${s.title}`;
      document.getElementById('edit-song-id').value = `${pI}_${sI}`;
      document.getElementById('form-pl-target').value = pI;
      document.getElementById('form-song-title').value = s.title;
      document.getElementById('form-song-artist').value = s.artist;
      document.getElementById('form-song-source').value = s.source;
      document.getElementById('form-song-cover').value = s.cover || '';
      document.getElementById('form-song-back-cover').value = s.backCover || '';

      const lyricsStr = (s.lyrics || []).map(l => {
        const m = Math.floor(l.time / 60);
        const sec = Math.floor(l.time % 60);
        return `[${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}] ${l.text}`;
      }).join('\n');
      document.getElementById('form-song-lyrics').value = lyricsStr;

      document.getElementById('btn-cancel-edit').style.display = 'inline-block';
      document.getElementById('admin-modal').scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById('btn-cancel-edit').onclick = resetSongForm;

    function resetSongForm() {
      document.getElementById('form-mode-title').textContent = '✦ 新增歌曲';
      document.getElementById('edit-song-id').value = '';
      document.getElementById('form-song-title').value = '';
      document.getElementById('form-song-artist').value = '';
      document.getElementById('form-song-source').value = '';
      document.getElementById('form-song-cover').value = '';
      document.getElementById('form-song-back-cover').value = '';
      document.getElementById('form-song-lyrics').value = '';
      document.getElementById('img-picker-status').textContent = '';
      document.getElementById('back-img-picker-status').textContent = '';
      document.getElementById('btn-cancel-edit').style.display = 'none';
    }

    document.getElementById('btn-save-song').onclick = () => {
      const editKey = document.getElementById('edit-song-id').value;
      const targetPl = parseInt(document.getElementById('form-pl-target').value);
      const title = document.getElementById('form-song-title').value.trim();
      const artist = document.getElementById('form-song-artist').value.trim() || 'Winter';
      const source = document.getElementById('form-song-source').value.trim();
      const rawCover = document.getElementById('form-song-cover').value.trim();
      const rawBackCover = document.getElementById('form-song-back-cover').value.trim();
      const cover = normalizeImageUrl(rawCover) || store[targetPl]?.cover || 'https://lh3.googleusercontent.com/d/1uaaVb_4JOQ9dF7wSlNxtIVHKMViueEa6';
      const backCover = normalizeImageUrl(rawBackCover) || '';
      const lyricsRaw = document.getElementById('form-song-lyrics').value;

      if (!title || !source) return alert('請填寫完整歌名與音訊來源！');

      const lyricsParsed = lyricsRaw.split('\n').map(l => {
        const m = l.match(/\[(\d+)(?::(\d+))?\]\s*(.*)/);
        if (m) {
          const t = m[2] !== undefined ? parseInt(m[1])*60 + parseFloat(m[2]) : parseFloat(m[1]);
          return { time: t, text: m[3] || '' };
        }
        return null;
      }).filter(Boolean).sort((a,b) => a.time - b.time);

      const songObj = {
        title,
        artist,
        source,
        cover,
        backCover,
        duration: 210,
        lyrics: lyricsParsed
      };

      if (editKey) {
        const [oldPI, oldSI] = editKey.split('_').map(Number);
        if (oldPI === targetPl) {
          store[oldPI].songs[oldSI] = songObj;
        } else {
          store[oldPI].songs.splice(oldSI, 1);
          store[targetPl].songs.push(songObj);
        }
      } else {
        store[targetPl].songs.push(songObj);
      }

      persistData();
      renderAdminUI();
      renderUI();
      resetSongForm();
      alert(`歌曲《${title}》已成功儲存！`);
    };

    document.getElementById('btn-add-pl').onclick = () => {
      const name = document.getElementById('admin-new-pl-name').value.trim();
      if (!name) return alert('請輸入歌單名稱！');
      store.push({ id: 'pl_' + Date.now(), name, songs: [] });
      document.getElementById('admin-new-pl-name').value = '';
      persistData();
      renderAdminUI();
      renderUI();
    };

    document.getElementById('btn-copy-code').onclick = () => {
      const fullHtml = document.documentElement.outerHTML;
      navigator.clipboard.writeText(fullHtml).then(() => {
        alert('已將當前完整 HTML 程式碼複製到剪貼簿！');
      });
    };

    document.getElementById('btn-dl-html').onclick = () => {
      const fullHtml = document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
    };

    renderUI();
  </script>
</body>
</html>
